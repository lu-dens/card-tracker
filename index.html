<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="법카">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>법카</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f1e1c;--sub:#6f6b64;--line:#e4e1da;--accent:#2f5d50;--on:#fff;--warn:#b4532a;--bar:#e8e4dc}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#252421;--ink:#f1efe9;--sub:#a29d94;--line:#3a3833;--accent:#7fb8a4;--on:#14211c;--warn:#e08a5f;--bar:#34322e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(36px + env(safe-area-inset-bottom))}
h1{font-size:18px;margin:4px 0 12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--sub)}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.over .big{color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:10px;align-items:flex-end}
.row>div{flex:1}
.num{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bar);border-radius:6px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.over .bar i{background:var(--warn)}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
textarea{min-height:90px;font-size:13px}
button{padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--on);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
button.ghost{background:none;color:var(--sub);border:1px solid var(--line);padding:6px 10px;font-size:13px;font-weight:500}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .m{flex:1;min-width:0}
li .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .d{font-size:12px;color:var(--sub)}
li .x{background:none;color:var(--sub);padding:4px 8px;font-size:18px;font-weight:400}
li .x.armed{color:var(--warn);font-size:13px}
.empty{color:var(--sub);justify-content:center}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:12px;color:var(--sub);margin-top:8px;min-height:1em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  var KEY='card-tracker-v1';
  var state={budget:500000,items:[]};
  var storageOk=true;
  try{var raw=localStorage.getItem(KEY); if(raw){var s=JSON.parse(raw); if(s&&Array.isArray(s.items)) state=s;}}catch(e){storageOk=false;}
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  var ui={budget:false,backup:false,msg:''};

  function save(){ try{localStorage.setItem(KEY,JSON.stringify(state)); storageOk=true;}catch(e){storageOk=false;} render(); }
  var won=function(n){return n.toLocaleString('ko-KR')+'원';};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var pad=function(n){return String(n).padStart(2,'0');};
  var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  var fmtDate=function(s){var p=String(s).split('-');return p.length===3?(+p[0])+'년 '+(+p[1])+'월 '+(+p[2])+'일':s;};
  var num=function(v){return parseInt(String(v).replace(/[^0-9]/g,''),10)||0;};

  function render(){
    var used=state.items.reduce(function(a,b){return a+b.amount;},0);
    var left=state.budget-used;
    var pct=state.budget>0?Math.min(100,used/state.budget*100):0;
    var items=state.items.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id;});
    var h='<h1>법인카드 사용 내역</h1>';
    h+='<div class="card'+(left<0?' over':'')+'"><div class="lbl">'+(left<0?'초과 금액':'남은 금액')+'</div><div class="big">'+won(Math.abs(left))+'</div>';
    h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
    h+='<div class="row"><div><div class="lbl">사용</div><div class="num">'+won(used)+'</div></div><div><div class="lbl">한도</div><div class="num">'+won(state.budget)+'</div></div><div style="text-align:right"><button class="ghost" id="eb">한도 변경</button></div></div>';
    if(ui.budget) h+='<form class="inline" id="bf"><input id="bv" inputmode="numeric" value="'+state.budget+'"><button>저장</button></form>';
    h+='</div>';
    h+='<div class="card"><form class="add" id="f"><input class="full" id="p" placeholder="사용처 (예: 다이소 - 사무실 휴지)" required autocomplete="off">';
    h+='<input id="a" inputmode="numeric" placeholder="금액" required autocomplete="off"><input id="d" type="date" value="'+today()+'" required>';
    h+='<input class="full" id="n" placeholder="메모 (선택)" autocomplete="off"><button class="full">추가</button></form></div>';
    h+='<div class="card"><div class="lbl" style="margin-bottom:4px">내역 '+items.length+'건</div><ul>';
    if(!items.length) h+='<li class="empty">아직 기록이 없습니다</li>';
    items.forEach(function(it){
      h+='<li><div class="m"><div class="p">'+esc(it.place)+'</div><div class="d">'+fmtDate(it.date)+(it.memo?' · '+esc(it.memo):'')+'</div></div><div class="num">'+won(it.amount)+'</div><button class="x" data-id="'+it.id+'" aria-label="삭제">×</button></li>';
    });
    h+='</ul></div>';
    h+='<div class="card"><div class="tools"><button class="ghost" id="bk">백업 · 복원</button></div>';
    if(ui.backup){
      h+='<div class="msg">아래 글자를 복사해 메모 앱 등에 보관하시면 됩니다. 복원할 때는 보관한 글자를 붙여넣고 복원을 누르십시오.</div>';
      h+='<textarea id="bt">'+esc(JSON.stringify(state))+'</textarea>';
      h+='<div class="inline"><button class="ghost" id="cp">복사</button><button class="ghost" id="rs">복원</button></div>';
    }
    h+='<div class="msg">'+esc(ui.msg||(storageOk?'내역은 이 휴대폰에만 저장됩니다.':'저장 공간을 쓸 수 없어 내역이 유지되지 않을 수 있습니다.'))+'</div></div>';
    document.getElementById('app').innerHTML=h;
    ui.msg='';

    document.getElementById('f').onsubmit=function(e){
      e.preventDefault();
      var amt=num(document.getElementById('a').value), place=document.getElementById('p').value.trim();
      if(!amt||!place) return;
      state.items.push({id:Date.now(),place:place,amount:amt,date:document.getElementById('d').value||today(),memo:document.getElementById('n').value.trim()});
      save();
    };
    document.getElementById('eb').onclick=function(){ui.budget=!ui.budget;render();};
    var bf=document.getElementById('bf');
    if(bf) bf.onsubmit=function(e){e.preventDefault();var v=num(document.getElementById('bv').value);if(v){state.budget=v;ui.budget=false;save();}};
    document.getElementById('bk').onclick=function(){ui.backup=!ui.backup;render();};
    var cp=document.getElementById('cp');
    if(cp) cp.onclick=function(){
      var t=document.getElementById('bt');
      var done=function(){ui.msg='복사했습니다.';render();};
      try{navigator.clipboard.writeText(t.value).then(done,function(){t.select();document.execCommand('copy');done();});}
      catch(e){t.select();try{document.execCommand('copy');done();}catch(_){}}
    };
    var rs=document.getElementById('rs');
    if(rs) rs.onclick=function(){
      try{var s=JSON.parse(document.getElementById('bt').value);
        if(!s||!Array.isArray(s.items)||typeof s.budget!=='number') throw 0;
        state={budget:s.budget,items:s.items}; ui.backup=false; ui.msg='복원했습니다.'; save();
      }catch(e){ui.msg='백업 글자가 올바르지 않습니다.';render();}
    };
    Array.prototype.forEach.call(document.querySelectorAll('.x'),function(b){
      b.onclick=function(){
        if(b.classList.contains('armed')){var id=+b.dataset.id;state.items=state.items.filter(function(i){return i.id!==id;});save();}
        else{b.classList.add('armed');b.textContent='삭제';}
      };
    });
  }
  render();
  if('serviceWorker' in navigator){ try{navigator.serviceWorker.register('sw.js');}catch(e){} }
})();
</script>
</body>
</html>
